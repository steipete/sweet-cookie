name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.24.0
          run_install: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --audit-level=high

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: check
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.24.0
          run_install: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.13.0
          cache: pnpm

      - uses: oven-sh/setup-bun@v2.2.0

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:bun
      - run: pnpm build
      - name: Exercise the built CLI
        run: >-
          node packages/core/dist/cli.js example.com
          --browser chrome
          --inline-json
          '[{"name":"proof","value":"synthetic","domain":"example.com","path":"/"}]'
          --format header
